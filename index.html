<!DOCTYPE html>
<html>
<head>
<title>BBSR-OD AI Business Generator - Global</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background:#0f0f0f; color:white; font-family:Arial; text-align:center; padding:30px; }
.box { background:#1e1e1e; max-width:400px; margin:auto; padding:20px; border-radius:15px; }
input { width:90%; padding:12px; margin:8px; border-radius:8px; border:none; }
button { background:#00ff88; color:black; padding:12px 25px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
#result { background:black; margin-top:15px; padding:15px; border-radius:10px; color:#00ff88; text-align:left; }
</style>
</head>
<body>
<h1>🔥 BBSR-OD AI Business Generator 🔥</h1>
<p>Built in Bhubaneswar, Used Worldwide</p>

<div class="box">
<input id="name" placeholder="Your Name?">
<input id="skill" placeholder="Your Skill? e.g. video editing, teaching">
<input id="budget" placeholder="Your Budget? e.g. 500">
<br>
<button onclick="generate()">Generate Idea!</button>
<div id="result">Your AI business idea will appear here...</div>
</div>

<script>
function generate(){
 let name = document.getElementById('name').value || 'Friend';
 let skill = document.getElementById('skill').value.toLowerCase();
 let budget = document.getElementById('budget').value || '$10';
 let idea="", earning="";

 if(skill.includes('video') || skill.includes('editing')){
   idea = "YouTube Shorts + Reels Editing Agency";
   earning = "$200-$500/month";
 } else if(skill.includes('teach') || skill.includes('study')){
   idea = "Online Micro-Course Platform (Class 1-10)";
   earning = "$150/month";
 } else {
   idea = skill + " Freelance Service Agency";
   earning = "$100-$300/month";
 }

 document.getElementById('result').innerHTML = 
   `<b>Hello ${name}!</b><br><br>
    <b>IDEA:</b> ${idea}<br>
    <b>Budget:</b> ${budget}<br>
    <b>Potential Earning:</b> ${earning}<br><br>
    <b>Tip:</b> Start free on Instagram & Fiverr, no investment needed!<br><br>
    This tool was built in BBSR-OD to earn in dollars!`;
}
</script>
</body>
</html>
</html>
