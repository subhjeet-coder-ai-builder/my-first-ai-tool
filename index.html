<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBSR-OD AI - Business Generator PRO</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(99,102,241,0.3); border: 1px solid #334155; }
        h1 { text-align: center; font-size: 26px; margin-bottom: 5px; }
        .tagline { text-align: center; color: #94a3b8; font-size: 11px; margin-bottom: 20px; letter-spacing: 1.5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button.main-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #6366f1, #8b5cf6); border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        #result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 10px; display: none; border: 1px solid #334155; line-height: 1.5; }
        .pay-box { margin-top: 15px; padding: 16px; background: linear-gradient(135deg, #1e3a8a, #312e81); border-radius: 12px; text-align: center; display: none; border: 1px solid #4f46e5; }
        .pay-btn { display: block; width: 100%; padding: 13px; background: #22c55e; color: black; font-weight: bold; border-radius: 8px; text-decoration: none; margin-top: 12px; box-sizing: border-box; }
        .upi { font-size: 11px; color: #fde68a; margin-top: 8px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 BBSR-OD AI</h1>
        <div class="tagline">BUILT IN BHUBANESWAR, USED WORLDWIDE 🌍</div>
        <input id="name" placeholder="Your Name? e.g. Alex">
        <input id="skill" placeholder="Your Skill? e.g. video editing">
        <input id="budget" placeholder="Budget? e.g. 100">
        <button class="main-btn" onclick="generate()">Generate Idea! ✨</button>
        <div id="result"></div>
        <div id="payBox" class="pay-box">
            <div style="font-weight:bold; font-size:15px;">🔥 Get Full 30-Day Business Plan</div>
            <div style="font-size:12px; margin-top:6px; color:#cbd5e1">PDF + Daily Tasks + Client List + ChatGPT Prompts</div>
            <a id="upiLink" class="pay-btn" href="upi://pay?pa=sekharpanda828-1@okaxis&pn=Sekhar%20Panda&am=99&cu=INR">Pay Rs 99 via UPI - Instant</a>
            <div class="upi">UPI: sekharpanda828-1@okaxis</div>
            <a id="waLink" href="https://wa.me/919692500408?text=Hi%20Sekhar!%20I%20paid%20Rs%2099.%20Send%20my%20full%20plan." target="_blank" style="color:#86efac; font-size:13px; display:block; margin-top:12px; font-weight:bold; text-decoration:underline">✅ After Payment, Click Here to Send Screenshot on WhatsApp</a>
        </div>
    </div>
<script>
    function generate(){
        const name = document.getElementById('name').value || 'friend';
        const skill = document.getElementById('skill').value || 'your skill';
        const budget = document.getElementById('budget').value || '100';
        const ideas = [
            `YouTube Shorts + Reels Editing Agency for ${skill} creators - Charge $10/video`,
            `${skill} + AI Automation Service for Bhubaneswar local businesses`,
            `Instagram Theme Pages + Affiliate Marketing using ${skill}`,
            `Freelancing on Fiverr/Upwork with ${skill} skill - $20 per project`,
            `Sell ${skill} Templates on Etsy / Gumroad - Passive Income`
        ];
        const idea = ideas[Math.floor(Math.random()*ideas.length)];
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = `<b>Hello ${name}! 👋</b><br><br>IDEA: <span style="color:#a5b4fc; font-weight:bold;">${idea}</span><br><br>Budget: $${budget}<br>Potential: <span style="color:#4ade80; font-weight:bold;">$200-$500/month</span>`;
        document.getElementById('payBox').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>
</body>
</html>
</html>
</html>
